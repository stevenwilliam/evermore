# Evermore — nginx reverse proxy.
#
# ruuma owns `listen 80 default_server` and the existing evermore site owns
# :8090, so this build takes :8091. Only 80/443 are open on the host firewall;
# the Go service itself binds 127.0.0.1:8082 and is unreachable from the LAN.

upstream evermore_app {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen 8091;
    listen [::]:8091;
    server_name app.evermore.co.id dev.evermore.co.id _;

    # The Go handler caps bodies at 6 MiB; nginx refuses earlier and cheaper.
    client_max_body_size 6m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Do not advertise the version to anyone probing.
    server_tokens off;

    access_log /var/log/nginx/evermore-app.access.log;
    error_log  /var/log/nginx/evermore-app.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json;
    # Fonts are already woff2-compressed; gzipping them again wastes CPU.

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://evermore_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering on;
    }

    # The app sets its own Cache-Control; nginx must not override it. These
    # blocks exist only so the proxy does not buffer-then-revalidate assets.
    location ~* ^/fonts/ {
        proxy_pass http://evermore_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

{{define "content"}}
<section class="section">
  <div class="container container-narrow">
    <h1>{{t .L "auth.signin"}}</h1>
    <form class="stack" id="login-form" data-auth-form data-endpoint="/api/v1/auth/login"
          data-next="{{if .Next}}{{.Next}}{{else}}/app/orders{{end}}">
      <p>
        <label for="email">{{t .L "auth.email"}}</label><br>
        <input class="searchbox" style="width:100%" type="email" id="email" name="email"
               autocomplete="email" required>
      </p>
      <p>
        <label for="password">{{t .L "auth.password"}}</label><br>
        <input class="searchbox" style="width:100%" type="password" id="password" name="password"
               autocomplete="current-password" required>
      </p>
      <p role="alert" aria-live="polite" data-auth-error class="callout callout-warn" hidden></p>
      <p><button class="btn btn-solid" type="submit">{{t .L "auth.signin"}}</button></p>
      <p class="meta">{{t .L "auth.noaccount"}} <a href="/app/register">{{t .L "auth.register"}}</a></p>
    </form>
  </div>
</section>
{{end}}

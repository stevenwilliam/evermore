{{define "content"}}
<section class="section">
  <div class="container container-narrow">
    <p class="eyebrow">{{t .L "acct.eyebrow"}}</p>
    <h1>{{t .L "alg.title"}}</h1>
    <p>{{t .L "alg.sub"}}</p>

    {{if .Notice}}<div class="callout" role="status"><p style="margin:0">{{.Notice}}</p></div>{{end}}
    {{if .Message}}<div class="callout callout-warn" role="alert"><p style="margin:0">{{.Message}}</p></div>{{end}}

    <form method="post" action="/app/allergies" class="stack" style="margin-top:var(--space-6)">
      <fieldset style="border:0;padding:0;margin:0">
        <legend class="eyebrow">{{t .L "alg.legend"}}</legend>
        <div class="stack" style="margin-top:var(--space-3)">
          {{range .Allergens}}
          <label style="display:flex;gap:var(--space-3);align-items:center;min-height:var(--tap)">
            <input type="checkbox" name="allergen" value="{{.Slug}}" {{if .Selected}}checked{{end}}>
            <span>{{.Name}}</span>
          </label>
          {{end}}
        </div>
      </fieldset>
      <p><button class="btn btn-primary" type="submit">{{t .L "alg.save"}}</button></p>
      <p class="btn-reason">{{t .L "alg.none"}}</p>
    </form>
  </div>
</section>
{{end}}
